name: Deploy to WordPress.org
on:
  release:
    types: [published]

# Least privilege: the job only checks out the repo and deploys to WordPress.org
# SVN using SVN_USERNAME/SVN_PASSWORD secrets — it never writes back via GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to WordPress.org
    runs-on: ubuntu-latest
    # Skip pre-releases (beta, rc, alpha) — only stable releases ship to WP.org SVN.
    if: github.event.release.prerelease == false
    steps:
      - uses: actions/checkout@v7

      # The plugin lives at the repo root, so BUILD_DIR is left unset and the
      # action reads .distignore to decide what to ship.
      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: digitizer-ai-agent-log
          ASSETS_DIR: .wordpress-org
