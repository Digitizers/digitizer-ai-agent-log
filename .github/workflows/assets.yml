name: Update WordPress.org Assets

# Assets-only deploy (icon, banner, screenshots) to the SVN /assets/ dir.
# Does not touch plugin code or the version. Trigger manually.
on:
  workflow_dispatch:

# Least privilege: checkout + SVN asset upload (SVN secrets) only; no GITHUB_TOKEN writes.
permissions:
  contents: read

jobs:
  assets:
    name: Update WordPress.org Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # readme.txt already sits at the repo root, so no staging step is needed.
      - name: WordPress.org Plugin Assets Update
        uses: 10up/action-wordpress-plugin-asset-update@2480306f6f693672726d08b5917ea114cb2825f7 # 2.2.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: digitizer-ai-agent-log
          ASSETS_DIR: .wordpress-org
          IGNORE_OTHER_FILES: true
